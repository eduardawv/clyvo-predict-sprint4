server.port=8080

# Banco padrao (desenvolvimento): Oracle FIAP.
# Credenciais NUNCA ficam no codigo: sao lidas de variaveis de ambiente.
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.username=${ORACLE_USER:}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=validate

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.flyway.locations=classpath:db/migration/oracle
spring.flyway.baseline-on-migrate=true

rsa.private-key=classpath:keys/private_key.pem
rsa.public-key=classpath:keys/public_key.pem

clyvo.ai.url=${CLYVO_AI_URL:http://localhost:5000}
clyvo.ai.connect-timeout-ms=5000
clyvo.ai.read-timeout-ms=60000
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
