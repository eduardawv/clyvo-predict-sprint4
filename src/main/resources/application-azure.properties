# =================================================================
# Perfil "azure" - CP5 DevOps Tools & Cloud Computing
# Ativado pela App Setting SPRING_PROFILES_ACTIVE=azure no Web App.
#
# Nenhum segredo neste arquivo. URL, usuario e senha do banco chegam
# pelas App Settings do Azure Web App (variaveis de ambiente):
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# =================================================================

# App Service (Linux, Java SE) encaminha o trafego para a porta 80
server.port=${PORT:80}

# Azure SQL Database (SQL Server)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false

# Flyway cria as tabelas no Azure SQL (scripts T-SQL proprios)
spring.flyway.locations=classpath:db/migration/sqlserver
# true: se alguem rodar a DDL manualmente antes do primeiro deploy, o Flyway
# faz baseline em vez de abortar a subida da aplicacao
spring.flyway.baseline-on-migrate=true
